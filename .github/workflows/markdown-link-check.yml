name: 'Markdown Link Check'

on:
  pull_request:
    branches: [ master, develop ]
  schedule:
    - cron: '0 6 * * 0'

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: '--no-progress **/*.md'
          fail: true